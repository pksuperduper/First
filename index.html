<meta charset="UTF-8">
<title>Pray Mad Libs</title>

<p style="font-size: 30px; font-family: bradley hand">
Mad Libs -- <br> Enter words, click "See Surprise!" and see your story! <br> The questions are open-ended so people can express their creativity!
</p>

<body bgcolor= "#5B9E48">

<form id="formData" style="font-size: 20px; font-family: bradley hand">
    <fieldset>
        <label>What fun place do you want to go to most? (example, Carribean, Bermuda Triangle): </label><input type="text" name="noun"><br>
        <label>Which hobby do you like most? (example, Cooking, Sleeping): </label><input type="text" name="activity"><br>
        <label>What is something different from what you have ever done? (example, Marketing, Software, Have Fun): </label><input type="text" name="different"><br>
        <label>What do you do as your last move? (example, Checkmate in Chess, Write in my Journal, Win): </label><input type="text" name="final"><br>
        <!-- etc etc etc -->
    </fieldset>
</form>

<p></p>
<button onclick="goMadLib(formData)">See Surprise!</button> 
<p></p>

<div id = "content" style="text-align: center; font-size: 30px; font-family: bradley hand"></div>

</script>
